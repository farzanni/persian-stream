<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}فی‌استریم{% endblock %}</title>
<style>
  @font-face { font-family: 'Vazirmatn';
    src: url('/static/fonts/Vazirmatn-Regular.woff2') format('woff2');
    font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Vazirmatn';
    src: url('/static/fonts/Vazirmatn-Bold.woff2') format('woff2');
    font-weight: 700; font-display: swap; }

  :root { --bg:#0b0d12; --bg2:#12151c; --card:#171a22; --line:#232833;
    --fg:#eef0f6; --dim:#8a92a6; --accent:#7c5cff; --accent2:#9d85ff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg);
    font-family: Vazirmatn, Tahoma, sans-serif; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }

  header { position: sticky; top: 0; z-index: 50; display: flex;
    align-items: center; gap: 18px; padding: 14px 28px;
    background: rgba(11,13,18,.82); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line); }
  .logo { font-size: 1.25rem; font-weight: 700; }
  .logo span { color: var(--accent); }
  header nav { display: flex; gap: 4px; }
  header nav a { padding: 7px 13px; border-radius: 999px; color: var(--dim);
    font-size: .92rem; transition: all .15s; }
  header nav a:hover { color: var(--fg); background: var(--bg2); }
  header nav a.on { color: #fff; background: var(--accent); }
  header form { margin-inline-start: auto; display: flex; gap: 8px; }
  input[type=search] { background: var(--bg2); border: 1px solid var(--line);
    color: var(--fg); border-radius: 999px; padding: 9px 18px;
    font-family: inherit; width: 230px; outline: none; }
  input[type=search]:focus { border-color: var(--accent); }
  button { background: var(--accent); color: #fff; border: 0;
    border-radius: 999px; padding: 9px 20px; cursor: pointer;
    font-family: inherit; font-size: .92rem; transition: filter .15s; }
  button:hover { filter: brightness(1.15); }
  main { max-width: 1280px; margin: 0 auto; padding: 24px 28px 60px; }

  /* poster rows (Rive style) */
  .row { margin: 26px 0; }
  .row > h2 { font-size: 1.08rem; margin-bottom: 12px; color: var(--fg); }
  .rail { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .card { flex: 0 0 138px; }
  .card img { width: 138px; aspect-ratio: 2/3; object-fit: cover;
    border-radius: 10px; background: var(--card); border: 1px solid var(--line);
    transition: transform .18s, box-shadow .18s; display:block; }
  .card:hover img { transform: translateY(-4px) scale(1.03);
    box-shadow: 0 10px 26px rgba(124,92,255,.25); border-color: var(--accent); }
  .card .t { font-size: .8rem; margin-top: 7px; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis; }
  .card .y { font-size: .72rem; color: var(--dim); }

  .muted { color: var(--dim); }
  @media (max-width: 720px) {
    header { flex-wrap: wrap; padding: 12px 16px; }
    main { padding: 18px 16px 50px; }
    input[type=search] { width: 150px; }
  }
</style>
<script>
/* Continue-watching + bookmarks store — defined in <head> so page-level
   scripts can call FIS.addCW()/FIS.save() safely. */
(function () {
  function load(k) { try { return JSON.parse(localStorage.getItem(k) || '[]'); }
                     catch (_) { return []; } }
  window.FIS = {
    cw: load('fis_cw'),
    bm: load('fis_bm'),
    save() { localStorage.setItem('fis_cw', JSON.stringify(this.cw));
             localStorage.setItem('fis_bm', JSON.stringify(this.bm)); },
    addCW(item) {
      this.cw = this.cw.filter(x => x.id !== item.id);
      this.cw.unshift(Object.assign({}, item, {ts: Date.now()}));
      this.cw = this.cw.slice(0, 12);
      this.save();
    },
    toggleBm(item) {
      const had = this.bm.some(x => x.id === item.id);
      if (had) this.bm = this.bm.filter(x => x.id !== item.id);
      else this.bm.unshift(Object.assign({ts: Date.now()}, item));
      this.save();
      return !had;
    },
    has(id) { return this.bm.some(x => x.id === id); }
  };
})();
</script>
</head>
<body>
<header>
  <a class="logo" href="/">فی<span>استریم</span></a>
  <nav>
    <a href="/" class="{{ 'on' if nav=='home' else '' }}">خانه</a>
    <a href="/browse/movie" class="{{ 'on' if nav=='movie' else '' }}">فیلم</a>
    <a href="/browse/series" class="{{ 'on' if nav=='series' else '' }}">سریال</a>
  </nav>
  <form action="/" method="get">
    <input type="search" name="q" value="{{ q or '' }}" placeholder="جستجو…">
    <button>جستجو</button>
  </form>
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
